name: Refresh profile cards

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Generate and validate complete SVG set
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/refresh-profile-cards.mjs
      - name: Publish complete last-good snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/profile/stats.svg assets/profile/languages.svg assets/profile/streak.svg assets/profile/activity.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh profile card snapshots'
          git pull --rebase origin main
          git push origin HEAD:main
